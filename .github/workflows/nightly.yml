name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: nightly

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run python scripts/build.py all --date "$(date -u +%F)"
      - name: Commit and push if changed
        run: |
          git add -A
          # skip empty or date-only refreshes so open data PRs do not conflict daily
          if ! bash scripts/nightly_should_commit.sh; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: nightly refresh $(date -u +%F)"
          git push
