name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run pytest -q
      - run: uv run python scripts/build.py validate
      - run: uv run python scripts/build.py build --check --skip-enrich
      - name: Wanted rules this PR fills
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:data/.cache/wanted.json > "$RUNNER_TEMP/base-wanted.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/base-wanted.json"
          uv run python scripts/build.py wanted --base-cache "$RUNNER_TEMP/base-wanted.json" | tee -a "$GITHUB_STEP_SUMMARY"
