# Wanted list: gap rules. A rule is "filled" when any atlas entry matches its query.
- id: open-gulf-tts
  title: Open-licensed TTS for Qatar, Kuwait, Bahrain or Oman
  why: Open Gulf TTS exists for the UAE and Saudi Arabia, but none is listed from Qatar, Kuwait, Bahrain, or Oman.
  query: {type: tts, dialects: gulf, country: [QA, KW, BH, OM], license_class: open}
- id: moroccan-ocr-dataset
  title: Open Moroccan Arabic OCR dataset
  why: The only Moroccan OCR dataset listed has no clear license, so no openly licensed one is available.
  query: {type: dataset, country: MA, tasks: ocr, license_class: open}
- id: sudanese-asr
  title: Sudanese Arabic speech dataset for ASR
  why: A Sudanese ASR model exists, but no Sudanese speech dataset to train or test one is listed.
  query: {type: dataset, country: SD, tasks: asr}
- id: mauritania-anything
  title: Anything from Mauritania
  why: Mauritania has no listed model, dataset, or tool of any kind.
  query: {country: MR}
- id: yemeni-dataset
  title: Open Yemeni speech dataset
  why: No openly licensed Yemeni dataset for speech recognition or synthesis is listed.
  query: {type: dataset, country: YE, tasks: [asr, speech, tts], license_class: open}
- id: on-device-embedding
  title: On-device dialectal Arabic embedding model
  why: On-device embeddings exist for MSA, but none is marked as targeting a dialect.
  query: {type: embedding, on_device: true, dialects: [egy, gulf, lev, magh, iraqi, sudanese, yemeni]}
- id: iraqi-tts
  title: Open-licensed Iraqi Arabic TTS
  why: The only TTS covering Iraqi has no clear license, so no openly licensed one is available.
  query: {type: tts, dialects: iraqi, license_class: open}
- id: libyan-corpus
  title: Libyan Arabic corpus
  why: No dataset from or about Libya is listed.
  query: {type: dataset, country: LY}
- id: syrian-llm-finetune
  title: On-device open Syrian Arabic LLM
  why: No openly licensed Syrian language model is marked as able to run on-device.
  query: {type: llm, country: SY, on_device: true, license_class: open}
- id: palestinian-asr
  title: Palestinian Arabic speech recognition
  why: No speech recognition model from Palestine is listed.
  query: {type: asr, country: PS}
- id: omani-dialect-dataset
  title: Open Omani dialect dataset
  why: Omani datasets are listed, but none has a clear open license.
  query: {type: dataset, country: OM, license_class: open}
- id: kuwaiti-dataset
  title: Open Kuwaiti Arabic dataset
  why: The only Kuwaiti dataset listed has no clear license.
  query: {type: dataset, country: KW, license_class: open}
- id: bahraini-dataset
  title: Open Bahraini Arabic dataset
  why: The only Bahraini dataset listed is non-commercial, so no openly licensed one is available.
  query: {type: dataset, country: BH, license_class: open}
- id: horn-comoros-resource
  title: Resources from the Horn of Africa and Comoros
  why: Nothing from Comoros, Djibouti, or Somalia is listed.
  query: {country: [KM, DJ, SO]}
- id: handwriting-ocr-benchmark
  title: Open Arabic handwriting benchmark
  why: No openly licensed benchmark covers Arabic handwriting recognition.
  query: {type: benchmark, tasks: [handwriting, htr], license_class: open}
