[project]
name = "arabic-ai-atlas"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.20", "mcp>=2,<3"]
[dependency-groups]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv]
package = true
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["atlas"]
