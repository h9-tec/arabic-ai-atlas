.n { stroke: var(--bubble-stroke); stroke-width: .8; }
.nl { font-size: 11.5px; font-weight: 600; fill: #FFFFFF; pointer-events: none; }
a:hover .n, a:hover .root { opacity: .85; }
.footer { font-size: 15px; fill: var(--muted); }
.llm { fill: #4F46E5; }
.asr { fill: #0891B2; }
.tts { fill: #0E7490; }
.ocr { fill: #B45309; }
.embedding { fill: #7C3AED; }
.tool { fill: #475569; }
.benchmark { fill: #B91C1C; }
.dataset { fill: #047857; }
.more { fill: #6B7280; }
</style>
